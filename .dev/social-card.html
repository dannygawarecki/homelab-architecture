<!doctype html>
<html><head><meta charset="utf-8">
<style>

       font-weight: 700; letter-spacing: -0.6px; width: 1000px; }
  .pills { position: absolute; top: 436px; display: flex; gap: 14px; }
  .pill { font-family: "Cascadia Mono", Consolas, monospace; font-size: 20px; color: #c9d4de;
          padding: 11px 21px; border: 1.5px solid #2b3542; border-radius: 999px; background: #151b23; }

         font-size: 20px; color: #6e7d8d; }

<body><div class="wrap">
  <div class="brand">
    <svg viewBox="0 0 31 34"><polygon points="15.5,0 31,8.5 31,25.5 15.5,34 0,25.5 0,8.5" fill="#4fa3ff"/></svg>
